<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#140d08">
<title>敲木鱼 · 功德 +1</title>
<meta name="description" content="登录邮箱，敲一下木鱼，积一份功德。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='16' fill='%23a85f2c'/><text x='32' y='45' font-size='34' text-anchor='middle' fill='%232a1206' font-family='serif' font-weight='700'>木</text></svg>">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="glow" aria-hidden="true"></div>

<header class="topbar">
  <a class="brand" href="./">
    <span class="brand-mark" aria-hidden="true">木</span>
    <span>敲木鱼</span>
  </a>
  <div class="topbar-actions">
    <button id="soundToggle" class="icon-btn" type="button" aria-pressed="true" aria-label="关闭木鱼声" title="木鱼声">
      <svg class="sound-on" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M18 8a6 6 0 0 0-12 0c0 7-3 8-3 8h18s-3-1-3-8"/>
        <path d="M13.7 21a2 2 0 0 1-3.4 0"/>
      </svg>
      <svg class="sound-off" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M13.7 21a2 2 0 0 1-3.4 0"/>
        <path d="M18.6 5.4A6 6 0 0 1 18 8c0 7 3 8 3 8H6"/>
        <path d="M4.6 8.6C4.5 8.4 4.5 8.2 4.5 8a6 6 0 0 1 8.9-5.3"/>
        <path d="m3 3 18 18"/>
      </svg>
    </button>
    <button id="authBtn" class="chip" type="button">邮箱登录</button>
  </div>
</header>

<main class="stage">
  <section class="stats" aria-label="功德统计">
    <div class="stat">
      <span class="stat-label">我的功德</span>
      <strong id="myTotal" class="stat-value">0</strong>
    </div>
    <div class="stat">
      <span class="stat-label">今日</span>
      <strong id="myToday" class="stat-value">0</strong>
    </div>
    <div class="stat">
      <span class="stat-label">全站今日</span>
      <strong id="globalToday" class="stat-value">0</strong>
    </div>
  </section>

  <div class="muyu-wrap">
    <div id="rippleLayer" class="ripple-layer" aria-hidden="true"></div>
    <button id="muyu" class="muyu" type="button" aria-label="敲一下木鱼，功德加一">
      <svg class="muyu-svg" viewBox="0 0 320 260" aria-hidden="true">
        <defs>
          <radialGradient id="wood" cx="34%" cy="24%" r="86%">
            <stop offset="0%" stop-color="#d99a58"/>
            <stop offset="46%" stop-color="#a85f2c"/>
            <stop offset="100%" stop-color="#552a10"/>
          </radialGradient>
          <radialGradient id="inner" cx="50%" cy="30%" r="70%">
            <stop offset="0%" stop-color="#3a1a08"/>
            <stop offset="100%" stop-color="#1b0b03"/>
          </radialGradient>
          <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#f0c489" stop-opacity=".9"/>
            <stop offset="100%" stop-color="#6b3413" stop-opacity=".2"/>
          </linearGradient>
          <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="6"/>
          </filter>
        </defs>
        <ellipse cx="160" cy="226" rx="112" ry="18" fill="#000" opacity=".35" filter="url(#soft)"/>
        <ellipse cx="160" cy="148" rx="122" ry="88" fill="url(#wood)" stroke="#3d1e0c" stroke-width="5"/>
        <ellipse cx="160" cy="148" rx="122" ry="88" fill="url(#rim)" opacity=".35"/>
        <ellipse cx="126" cy="104" rx="58" ry="26" fill="#fff" opacity=".13"/>
        <path d="M74 172 Q160 214 246 172 Q160 198 74 172 Z" fill="url(#inner)"/>
        <path d="M78 170 Q160 206 242 170" fill="none" stroke="#401f0b" stroke-width="4" stroke-linecap="round"/>
        <circle cx="236" cy="126" r="13" fill="#2a1206"/>
        <circle cx="239" cy="122" r="4.5" fill="#f6dfae"/>
        <g stroke="#4a2410" stroke-width="2" fill="none" opacity=".45">
          <path d="M96 132 q10 -8 20 0 q10 8 20 0"/>
          <path d="M88 156 q10 -8 20 0 q10 8 20 0"/>
          <path d="M104 180 q10 -8 20 0 q10 8 20 0"/>
        </g>
        <path d="M196 196 q16 12 34 6" stroke="#6b3413" stroke-width="3" fill="none" opacity=".5"/>
      </svg>
    </button>

    <div id="mallet" class="mallet" aria-hidden="true">
      <svg viewBox="0 0 120 150">
        <rect x="53" y="8" width="14" height="82" rx="7" fill="#8a5330"/>
        <rect x="53" y="8" width="6" height="82" rx="3" fill="#c98a4b" opacity=".45"/>
        <rect x="49" y="74" width="22" height="9" rx="4" fill="#5a2d12"/>
        <ellipse cx="60" cy="110" rx="27" ry="21" fill="#b9763f" stroke="#5a2d12" stroke-width="3"/>
        <ellipse cx="52" cy="102" rx="9" ry="6" fill="#f3d9a4" opacity=".3"/>
      </svg>
    </div>

    <div id="floatLayer" class="float-layer" aria-hidden="true"></div>
  </div>

  <p id="combo" class="combo" aria-live="polite"></p>
  <p class="hint">点击木鱼，或按 <kbd>空格</kbd> · 一下一份功德</p>

  <div id="guestNote" class="note" hidden>
    当前为游客模式，功德只存在本机。<button id="guestLogin" class="link-btn" type="button">登录后存入云端</button>
  </div>
</main>

<footer class="footer">
  <span>功德仅供娱乐，不作任何宗教或现实承诺</span>
  <a href="https://github.com/ninetyhe-90/muyu" target="_blank" rel="noreferrer">GitHub</a>
</footer>

<div id="authModal" class="modal" hidden>
  <div class="modal-backdrop" data-close></div>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="authTitle">
    <button class="modal-close" type="button" data-close aria-label="关闭">×</button>

    <div id="authFormView">
      <h2 id="authTitle">邮箱登录</h2>
      <p class="modal-sub">输入邮箱，我们会发送一封登录邮件。功德会存到你的账号里。</p>
      <form id="loginForm" novalidate>
        <label class="field">
          <span>邮箱</span>
          <input id="email" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com" required>
        </label>
        <button id="sendBtn" class="primary" type="submit">发送登录链接</button>
      </form>
      <p id="authError" class="error" role="alert" hidden></p>
      <p class="modal-fine">登录即表示你同意只把本站当作一个小玩具。</p>
    </div>

    <div id="authSentView" hidden>
      <h2>去邮箱点一下</h2>
      <p class="modal-sub">登录链接已发往 <strong id="sentEmail"></strong>。点开邮件里的链接就会回到这里，功德自动同步。</p>
      <p class="modal-fine">没收到？检查垃圾邮件，或 <button id="resendBtn" class="link-btn" type="button">重新发送</button>。</p>
      <button class="ghost" type="button" data-close>知道了</button>
    </div>

    <div id="authUserView" hidden>
      <h2>已登录</h2>
      <p class="modal-sub">当前账号：<strong id="userEmail"></strong></p>
      <div class="user-stats">
        <div><span>我的功德</span><strong id="userTotal">0</strong></div>
        <div><span>今日</span><strong id="userToday">0</strong></div>
      </div>
      <button id="logoutBtn" class="ghost" type="button">退出登录</button>
    </div>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="config.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
