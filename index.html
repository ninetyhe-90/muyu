<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#9fd8f0">
<title>敲木鱼 · 功德 +1</title>
<meta name="description" content="登录邮箱，敲一下木鱼，积一份功德。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='16' fill='%23f6c644'/><ellipse cx='32' cy='38' rx='20' ry='15' fill='%23c98850' stroke='%238a5326' stroke-width='3'/><path d='M14 34 Q32 24 50 34 Q32 42 14 34 Z' fill='%236b3d1a'/></svg>">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="scene" aria-hidden="true">
  <div class="sun"></div>
  <span class="cloud c1"></span>
  <span class="cloud c2"></span>
  <span class="cloud c3"></span>
  <svg class="hills" viewBox="0 0 1440 340" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
    <path d="M0 210 Q240 96 480 186 Q720 262 960 170 Q1200 88 1440 190 V340 H0 Z" fill="#bfe3c0"/>
    <path d="M0 262 Q360 158 720 236 Q1080 306 1440 226 V340 H0 Z" fill="#9ed49a"/>
    <path d="M0 306 Q480 228 960 286 Q1200 310 1440 268 V340 H0 Z" fill="#7fc36a"/>
    <g class="flowers">
      <g transform="translate(180 312)"><circle r="5" fill="#fff"/><circle r="2" fill="#f4b942"/></g>
      <g transform="translate(360 326)"><circle r="5" fill="#ffd6e0"/><circle r="2" fill="#e86a8a"/></g>
      <g transform="translate(920 318)"><circle r="5" fill="#fff"/><circle r="2" fill="#f4b942"/></g>
      <g transform="translate(1180 330)"><circle r="5" fill="#ffd6e0"/><circle r="2" fill="#e86a8a"/></g>
      <g transform="translate(1320 314)"><circle r="5" fill="#fff"/><circle r="2" fill="#f4b942"/></g>
    </g>
  </svg>
</div>
<div id="flashbang" class="flashbang" aria-hidden="true"></div>

<header class="topbar">
  <a class="brand" href="./">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 64 64" width="22" height="22">
        <ellipse cx="32" cy="38" rx="20" ry="15" fill="#c98850" stroke="#8a5326" stroke-width="3"/>
        <path d="M14 34 Q32 24 50 34 Q32 42 14 34 Z" fill="#6b3d1a"/>
      </svg>
    </span>
    <span class="brand-text">敲木鱼</span>
  </a>
  <div class="topbar-actions">
    <button id="soundToggle" class="icon-btn" type="button" aria-pressed="true" aria-label="关闭木鱼声" title="木鱼声">
      <svg class="sound-on" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M18 8a6 6 0 0 0-12 0c0 7-3 8-3 8h18s-3-1-3-8"/>
        <path d="M13.7 21a2 2 0 0 1-3.4 0"/>
        <path d="M9 9.5c1.6 1.6 2.2 3.4 1.8 5.5" opacity=".6"/>
      </svg>
      <svg class="sound-off" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M13.7 21a2 2 0 0 1-3.4 0"/>
        <path d="M18.6 5.4A6 6 0 0 1 18 8c0 7 3 8 3 8H6"/>
        <path d="M4.6 8.6C4.5 8.4 4.5 8.2 4.5 8a6 6 0 0 1 8.9-5.3"/>
        <path d="m3 3 18 18"/>
      </svg>
    </button>
    <button id="authBtn" class="chip" type="button">邮箱登录</button>
  </div>
</header>

<main class="stage">
  <section class="stats" aria-label="功德统计">
    <div class="stat">
      <span class="stat-label">我的功德</span>
      <strong id="myTotal" class="stat-value">0</strong>
    </div>
    <div class="stat">
      <span class="stat-label">今日</span>
      <strong id="myToday" class="stat-value">0</strong>
    </div>
    <div class="stat">
      <span class="stat-label">全站今日</span>
      <strong id="globalToday" class="stat-value">0</strong>
    </div>
  </section>

  <div class="muyu-wrap">
    <div id="impactGlow" class="impact-glow" aria-hidden="true"></div>
    <canvas id="scene3d" class="scene3d" aria-hidden="true"></canvas>
    <div id="rippleLayer" class="ripple-layer" aria-hidden="true"></div>
    <button id="muyu" class="muyu" type="button" aria-label="敲一下木鱼，功德加一">
      <svg class="muyu-svg" viewBox="0 0 440 330" aria-hidden="true">
        <defs>
          <radialGradient id="woodG" cx="36%" cy="28%" r="90%">
            <stop offset="0%" stop-color="#e2a96b"/>
            <stop offset="60%" stop-color="#c98850"/>
            <stop offset="100%" stop-color="#a06a38"/>
          </radialGradient>
          <linearGradient id="dogBody" x1="0.2" y1="0" x2="0.8" y2="1">
            <stop offset="0%" stop-color="#ffd95e"/>
            <stop offset="100%" stop-color="#f0b83a"/>
          </linearGradient>
          <linearGradient id="dogHead" x1="0.2" y1="0" x2="0.8" y2="1">
            <stop offset="0%" stop-color="#ffdf70"/>
            <stop offset="100%" stop-color="#f2bc42"/>
          </linearGradient>
        </defs>

        <!-- 木鱼 -->
        <g class="muyu-fish">
          <ellipse cx="105" cy="288" rx="60" ry="11" fill="rgba(60,40,10,.18)"/>
          <ellipse cx="105" cy="244" rx="56" ry="44" fill="url(#woodG)" stroke="#8a5326" stroke-width="3"/>
          <path d="M64 228 Q105 210 146 228 Q105 242 64 228 Z" fill="#6b3d1a"/>
          <path d="M68 227 Q105 212 142 227" fill="none" stroke="#f0c489" stroke-width="2" opacity=".65" stroke-linecap="round"/>
          <path d="M70 262 Q105 274 140 262" fill="none" stroke="rgba(122,74,34,.5)" stroke-width="2" stroke-linecap="round"/>
          <path d="M62 246 Q105 258 148 246" fill="none" stroke="rgba(122,74,34,.4)" stroke-width="2" stroke-linecap="round"/>
          <circle cx="136" cy="222" r="3" fill="#6b3d1a"/>
          <ellipse cx="84" cy="212" rx="16" ry="9" fill="#fff" opacity=".25"/>
        </g>

        <!-- 柴犬 -->
        <g class="dog">
          <ellipse cx="285" cy="296" rx="80" ry="12" fill="rgba(60,40,10,.18)"/>
          <path d="M330 240 C366 234 380 204 366 178 C362 208 344 224 322 230 Z" fill="#f6c644" stroke="#d99a26" stroke-width="3" stroke-linejoin="round"/>
          <path d="M285 292 C330 292 352 262 352 220 C352 180 324 154 286 154 C248 154 222 180 222 220 C222 262 244 292 285 292 Z" fill="url(#dogBody)" stroke="#d99a26" stroke-width="3"/>
          <ellipse cx="290" cy="254" rx="42" ry="36" fill="#fff8ea"/>
          <rect x="250" y="238" width="22" height="52" rx="11" fill="#f6c644" stroke="#d99a26" stroke-width="3"/>
          <ellipse cx="261" cy="292" rx="26" ry="9" fill="#f6c644" stroke="#d99a26" stroke-width="3"/>
          <!-- 耳朵 -->
          <path d="M222 76 L214 30 L256 56 Z" fill="#f6c644" stroke="#d99a26" stroke-width="3" stroke-linejoin="round"/>
          <path d="M228 66 L226 46 L246 58 Z" fill="#e8946a"/>
          <path d="M318 74 L330 28 L286 54 Z" fill="#f6c644" stroke="#d99a26" stroke-width="3" stroke-linejoin="round"/>
          <path d="M312 64 L318 44 L298 56 Z" fill="#e8946a"/>
          <!-- 头 -->
          <circle cx="272" cy="118" r="64" fill="url(#dogHead)" stroke="#d99a26" stroke-width="3"/>
          <path d="M212 126 Q272 190 332 126 Q330 168 272 172 Q216 170 212 126 Z" fill="#fff8ea"/>
          <!-- 眼睛 -->
          <ellipse cx="246" cy="110" rx="12" ry="14" fill="#fff"/>
          <circle cx="250" cy="112" r="4.5" fill="#2a2018"/>
          <ellipse cx="296" cy="110" rx="12" ry="14" fill="#fff"/>
          <circle cx="292" cy="112" r="4.5" fill="#2a2018"/>
          <!-- 鼻与嘴 -->
          <ellipse cx="272" cy="138" rx="9" ry="7" fill="#3a2a1a"/>
          <path d="M262 148 Q272 158 282 148" fill="none" stroke="#3a2a1a" stroke-width="3" stroke-linecap="round"/>
          <!-- 腮红 -->
          <ellipse cx="224" cy="136" rx="9" ry="5" fill="#ffb08a" opacity=".55"/>
          <ellipse cx="320" cy="136" rx="9" ry="5" fill="#ffb08a" opacity=".55"/>
        </g>

        <!-- 手臂与木槌 -->
        <g class="mallet-g">
          <path d="M232 226 Q204 236 178 230" fill="none" stroke="#d99a26" stroke-width="19" stroke-linecap="round"/>
          <path d="M232 226 Q204 236 178 230" fill="none" stroke="#f6c644" stroke-width="13" stroke-linecap="round"/>
          <path d="M174 228 L136 217" fill="none" stroke="#8a5326" stroke-width="8" stroke-linecap="round"/>
          <circle cx="176" cy="230" r="11" fill="#fff8ea" stroke="#d99a26" stroke-width="3"/>
          <circle cx="128" cy="214" r="15" fill="#c98850" stroke="#8a5326" stroke-width="3"/>
          <circle cx="123" cy="209" r="4" fill="#f0c489" opacity=".75"/>
        </g>
      </svg>
    </button>

    <canvas id="sparkCanvas" class="spark-canvas" aria-hidden="true"></canvas>
    <div id="floatLayer" class="float-layer" aria-hidden="true"></div>
  </div>

  <div class="combo-rail" aria-hidden="true"><i id="comboBar"></i></div>
  <p id="combo" class="combo" aria-hidden="true"></p>
  <p id="srLive" class="sr-only" role="status" aria-live="polite"></p>
  <p class="hint">点击柴犬，或按 <kbd>空格</kbd> · 一下一份功德</p>

  <div id="guestNote" class="note" hidden>
    当前为游客模式，功德只存在本机。<button id="guestLogin" class="link-btn" type="button">登录后存入云端</button>
  </div>
</main>

<footer class="footer">
  <span>功德仅供娱乐，不作任何宗教或现实承诺</span>
  <a href="https://github.com/ninetyhe-90/muyu" target="_blank" rel="noreferrer">GitHub</a>
</footer>

<dialog id="authModal" class="modal" aria-labelledby="authTitle">
  <div class="modal-card">
    <button class="modal-close" type="button" data-close aria-label="关闭">×</button>

    <div id="authFormView">
      <h2 id="authTitle">邮箱登录</h2>
      <p class="modal-sub">输入邮箱，我们会发送一封登录邮件。功德会存到你的账号里。</p>
      <form id="loginForm" novalidate>
        <label class="field">
          <span>邮箱</span>
          <input id="email" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com" required>
        </label>
        <button id="sendBtn" class="primary" type="submit">发送登录链接</button>
      </form>
      <p id="authError" class="error" role="alert" hidden></p>
      <p class="modal-fine">登录即表示你同意只把本站当作一个小玩具。</p>
    </div>

    <div id="authSentView" hidden>
      <h2>去邮箱点一下</h2>
      <p class="modal-sub">登录链接已发往 <strong id="sentEmail"></strong>。点开邮件里的链接就会回到这里，功德自动同步。</p>
      <p class="modal-fine">没收到？检查垃圾邮件，或 <button id="resendBtn" class="link-btn" type="button">重新发送</button>。</p>
      <button class="ghost" type="button" data-close>知道了</button>
    </div>

    <div id="authUserView" hidden>
      <h2>已登录</h2>
      <p class="modal-sub">当前账号：<strong id="userEmail"></strong></p>
      <div class="user-stats">
        <div><span>我的功德</span><strong id="userTotal">0</strong></div>
        <div><span>今日</span><strong id="userToday">0</strong></div>
      </div>
      <button id="logoutBtn" class="ghost" type="button">退出登录</button>
    </div>
  </div>
</dialog>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="config.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
